# One-command home-server stack: wger (via the `wger/` submodule's own
# compose file) + a headless aw-server + the Node server (this repo).
#
# First-time setup: `git submodule update --init` (or clone this repo with
# `--recurse-submodules` in the first place) before `docker compose up`,
# so the `wger/` directory actually has wger's own docker-compose.yml in
# it — `include:` below fails fast with a clear "no such file" otherwise.
#
# Bring up: docker compose up -d --build
# Tear down: docker compose down            (add -v to also wipe the named volumes)
#
# First-run secrets:
# - House Simulator's own server_config (broadcast_url/broadcast_secret/
#   admin_secret) lives in SQLite, not an env var — see DOCKER.md's "First
#   run" section for the exact `sqlite3`/docker exec command to set it
#   once the stack is up.
# - wger's own secrets (SECRET_KEY, POSTGRES_PASSWORD, ...) live in
#   `wger/config/prod.env`, committed upstream with wger's own quickstart
#   placeholder values (NOT unique to this install) — edit that file in
#   the submodule checkout before a real deployment, same as wger's own
#   docs recommend for anyone using their quickstart compose. This repo
#   never copies those values anywhere else, so there's nothing of ours to
#   keep in sync when you change them.
# - Once everything is up, link each House Simulator character to their
#   own wger account via the admin tool's Characters tab (wger API
#   token) — `wger_base_url` should be `http://web:8000` (wger's own
#   `web` service, reachable by name on the shared network below), not
#   `http://localhost:80` the way a non-Docker/same-machine install would
#   use. See "wger integration" in CLAUDE.md for the full picture.

include:
  # wger's own docker-compose.yml defines web/celery_worker/celery_beat/
  # nginx/db(postgres)/cache(redis)/powersync (the last three via its own
  # further `include:`s under wger/services/) — see that file and
  # wger/README.md for the full breakdown. Pulled in as a git submodule
  # (not vendored/copied) specifically so `git submodule update --remote`
  # can pick up wger's own upstream changes later without us having to
  # hand-maintain a second copy of their compose structure — the exact
  # "reuse, don't duplicate" reasoning CLAUDE.md's guiding principle
  # already states for code in this repo, applied to an external stack
  # instead. Compose resolves every relative path INSIDE wger's own
  # compose files (../config/prod.env, ./config-powersync, ...) relative
  # to where those files actually live, not relative to this file — i.e.
  # the submodule works exactly the same included as it would standalone.
  - path: ./wger/docker-compose.yml

services:
  aw-server:
    # Headless aw-server (the Rust data server ActivityWatch's desktop tray
    # app — aw-qt — normally launches for you). aw-qt itself is just a tray
    # launcher/watcher-manager; the actual API server underneath is a plain
    # binary that runs fine standalone. Rather than build our own image from
    # ActivityWatch's official `scripts/Dockerfile` (which requires checking
    # out aw-server-rust + its aw-webui submodule and compiling Rust), this
    # uses an existing community image that already does exactly that and
    # already binds to 0.0.0.0 (not aw-server's own 127.0.0.1-only default)
    # and already stores its data under one /config volume:
    #   https://github.com/GraphicHealer/aw-server-docker
    # Confirmed via that repo's Dockerfile: CMD is
    # `aw-server --host 0.0.0.0 --cors-origins "*"`, EXPOSE 5600, VOLUME /config.
    image: ghcr.io/graphichealer/aw-server-docker:latest
    # That image only publishes an amd64 manifest (confirmed via `docker
    # manifest inspect` — no arm64 entry at all), so on an arm64 host
    # (Apple Silicon Docker Desktop, a Raspberry Pi, ...) Docker refuses to
    # pull it without this. Delete this line entirely if your home server
    # is a plain x86_64 box (most "spare PC in the closet" home servers
    # are) — amd64 is then its native architecture already, no emulation
    # involved. On arm64 this runs under Rosetta/qemu emulation instead of
    # natively — fine for a lightweight Rust binary like aw-server, but if
    # that ever becomes a real problem, the alternative is building
    # aw-server-rust's own official multi-stage `scripts/Dockerfile` from
    # source instead (naturally multi-arch since it compiles per-platform,
    # see DOCKER.md), at the cost of a much slower Rust build.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - aw-server-data:/config
    ports:
      # Exposed to the host too (not just the house-simulator-server
      # container) purely for debugging via aw-server's own web UI at
      # http://<host>:5600 — not required for the Node server, which reaches
      # it over the Compose network below instead. Comment out if you don't
      # want AW's own UI reachable from the LAN at all.
      - "5600:5600"

  house-simulator-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - aw-server
    environment:
      # Overrides src/aw/client.ts's localhost default — see that file's own
      # comment. "aw-server" below is this compose file's service name,
      # resolved via Compose's built-in DNS; there is no loopback between
      # separate containers the way CLAUDE.md's "stays on loopback relative
      # to the Node server" assumed for the non-Docker install.
      - AW_HOST=aw-server
      - AW_PORT=5600
      - PORT=4000
    volumes:
      # server/db.ts resolves its SQLite file + WAL to <this dir>/data —
      # named volume so `docker compose down && docker compose up` (without
      # -v) keeps every goal/todo/character/room/activity and the
      # hand-edited server_config row (val.town + admin + lan secrets).
      - house-simulator-data:/app/server/data
    ports:
      # This is the one port that actually needs to reach the LAN — every
      # device (Tauri build or plain browser) connects here over WebSocket/
      # HTTP, same as CLAUDE.md's "every device on the home network ... gets
      # full read/write access". Change the host side (left of the colon)
      # if 4000 collides with something else on your home server; leave the
      # container side (right of the colon) matching PORT above.
      - "4000:4000"
    # No explicit `networks:` needed — wger's own compose renames this
    # whole project's default network to "wger_network" (see
    # wger/docker-compose.yml's own `networks: default: name:` override,
    # which `include:` merges into this project's model as-is), so
    # aw-server/house-simulator-server land on it automatically just by
    # being part of this project at all, same as wger's own services do.
    # Confirmed via `docker compose config`: every service here resolves
    # to the one network literally named "wger_network" with no further
    # configuration — house-simulator-server can reach wger's `web`
    # service by name (http://web:8000) for each character's
    # wger_base_url for free.

volumes:
  aw-server-data:
  house-simulator-data:
